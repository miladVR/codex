<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه امتیازدهی آتش‌نشانان ایمیدرو</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="help.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><img class="admin-logo" src="../assets/competition-logo.jpg" alt="نشان مسابقات آتش‌نشانان ایمیدرو"><div><strong>IMIDRO RESCUE</strong><small>مرکز فرماندهی مسابقه</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-view="dashboard">◫ تابلوی نتایج</button>
        <button class="nav-item" data-view="guide">؟ راهنمای نرم‌افزار</button>
        <button class="nav-item" data-view="entry">⏱ ثبت نتیجه</button>
        <button class="nav-item" data-view="approvals">✓ تأیید سرداور <span id="draft-badge"></span></button>
        <button class="nav-item" data-view="teams">♟ تیم‌ها</button>
        <button class="nav-item" data-view="draw">قرعه‌کشی تیم‌ها</button>
        <button class="nav-item" data-view="settings">⚙ تنظیمات و نمایشگر</button>
        <button class="nav-item" data-view="audit">↺ سوابق تغییرات</button>
      </nav>
      <div class="offline-card"><span class="status-dot"></span> آفلاین و آماده مسابقه<small>همه اطلاعات روی همین رایانه ذخیره می‌شود.</small></div>
      <button id="reset-all" class="btn danger reset-all">پاک‌کردن همه داده‌ها و شروع از صفر</button>
    </aside>
    <main>
      <header><div><div class="header-heading"><h1 id="view-title">تابلوی نتایج</h1><button id="view-help" class="help-icon" aria-label="راهنمای این بخش" type="button">؟</button></div><p id="venue"></p></div><div class="header-actions"><button id="backup-btn" class="btn ghost">نسخه پشتیبان</button><button id="display-btn" class="btn primary">بازکردن نمایشگر دوم</button></div></header>
      <section id="content"></section><footer class="org-credit">امور آموزش و توسعه شایستگی مجتمع مس سرچشمه رفسنجان</footer>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="sound.js"></script><script src="help.js"></script><script src="guide-content.js"></script><script src="guide.js"></script><script src="admin.js"></script>
</body>
</html>
