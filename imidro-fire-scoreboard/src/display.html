<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>نمایش زنده نتایج</title>
  <link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="display.css"><link rel="stylesheet" href="help.css">
</head>
<body>
  <main>
    <header><div class="brand"><img class="competition-logo" src="../assets/competition-logo.jpg" alt="نشان سومین دوره مسابقات آتش‌نشانان ایمیدرو"><div><p class="eyebrow">اراده، مهارت، افتخار</p><h1 id="competition-name">مسابقات آتش‌نشانان ایمیدرو</h1><p id="venue"></p></div></div><div class="clock"><strong id="clock">--:--</strong><span id="date"></span></div></header>
    <section class="meta"><span class="live"><i></i><span id="mode-label">نتایج رسمی زنده</span></span><span id="progress"></span><span id="connection-status" role="status">در حال اتصال…</span><span id="page-info"></span></section>
    <section id="podium" class="podium" aria-label="تیم‌های پیشتاز"></section>
    <section class="table-panel"><div class="section-title"><h2 id="table-title">جدول رده‌بندی تیمی</h2><span id="table-subtitle">کمترین مجموع رتبه‌ها، جایگاه بهتر</span></div><div id="standings"></div><div class="page-controls"><button id="previous-page" aria-label="صفحه قبلی">صفحه قبل</button><button id="pause-pages">توقف گردش</button><button id="next-page" aria-label="صفحه بعدی">صفحه بعد</button></div></section>
    <aside id="announcement" role="status" aria-live="polite">در انتظار نتیجهٔ تازه</aside>
    <footer><div id="sponsor-logos"></div><p id="display-message"></p><p class="org-credit">امور آموزش و توسعه شایستگی مجتمع مس سرچشمه رفسنجان</p></footer>
  </main>
  <script src="sound.js"></script><script src="help.js"></script><script src="display.js"></script>
</body>
</html>
