name: Build IMIDRO Fire Scoreboard for Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "imidro-fire-scoreboard/**"
      - ".github/workflows/imidro-fire-scoreboard-windows.yml"
  push:
    branches:
      - main
    paths:
      - "imidro-fire-scoreboard/package.json"
      - ".github/workflows/imidro-fire-scoreboard-windows.yml"
    tags:
      - "imidro-fire-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: imidro-fire-scoreboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: imidro-fire-scoreboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Native Electron and PDF smoke test
        run: npx electron scripts/smoke.cjs
      - name: Upload visual and PDF verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imidro-visual-verification
          path: imidro-fire-scoreboard/release/qa/*
      - name: Build Setup and Portable editions
        run: npm run dist:win
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: imidro-fire-scoreboard-windows
          path: imidro-fire-scoreboard/release/*.exe
      - name: Publish tested version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/imidro-fire-v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseTag = "imidro-fire-v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $releaseTag) {
            throw "Tag and package version do not match."
          }
          $existing = gh release view $releaseTag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              Write-Host "Published release $releaseTag already exists; leaving its files unchanged."
              exit 0
            }
            gh release upload $releaseTag release/*.exe docs/IMIDRO-Fire-Scoreboard-User-Guide-FA.pdf --clobber
          } else {
            gh release create $releaseTag release/*.exe docs/IMIDRO-Fire-Scoreboard-User-Guide-FA.pdf --draft --target $env:GITHUB_SHA --title "IMIDRO Fire Scoreboard v$version" --notes-file docs/RELEASE-NOTES-1.3.0.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
          $assets = (gh release view $releaseTag --json assets | ConvertFrom-Json).assets.name
          foreach ($required in @("IMIDRO-Fire-Scoreboard-$version-x64-setup.exe", "IMIDRO-Fire-Scoreboard-$version-x64-portable.exe", "IMIDRO-Fire-Scoreboard-User-Guide-FA.pdf")) {
            if ($required -notin $assets) { throw "Missing release asset: $required" }
          }
          gh release edit $releaseTag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
      - name: Update public installer manifest after successful publication
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/imidro-fire-v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update-release-manifest.py
