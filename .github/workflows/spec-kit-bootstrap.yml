name: Bootstrap Spec Kit for Codex (temporary)

on:
  push:
    branches:
      - chore/spec-kit-codex-bootstrap
    paths:
      - .github/workflows/spec-kit-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.ref_name == 'chore/spec-kit-codex-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official Spec Kit release
        run: python -m pip install "specify-cli==1.3.2"
      - name: Generate actual Spec Kit files for Codex + Windows PowerShell
        run: |
          specify version
          specify init --here --force --integration codex --script ps --non-interactive --ignore-agent-tools
          specify integration status
      - name: Verify that application files have not been modified
        run: |
          if [ -n "$(git status --porcelain -- cloze-studio/ imidro-fire-scoreboard/)" ]; then
            echo "::error::Unexpected application file modifications by scaffolding"
            git status --short
            exit 1
          fi
      - name: Commit generated scaffolding to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in .specify .agents .codex; do
            if [ -e "$dir" ]; then git add -A -- "$dir"; fi
          done
          if git diff --cached --quiet; then
            echo "No Spec Kit changes detected"
          else
            git commit -m "chore(spec-kit): generate official Codex scaffolding"
            git push origin HEAD:chore/spec-kit-codex-bootstrap
          fi
